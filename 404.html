<style>
  :root{
    --black:#000;--white:#fff;
    --mute:rgba(255,255,255,.52);--mute-2:rgba(255,255,255,.34);
    --line:rgba(255,255,255,.10);
    --ff:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ff-display:"DM Serif Display",Georgia,"Times New Roman",serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--black);color:var(--white);
    font-family:var(--ff);font-weight:300;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:grid;place-items:center;
    padding:clamp(24px,6.6vw,150px);
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:#fff;color:#000}

  /* мягкое свечение за текстом, как в секциях сайта */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 42%,rgba(255,255,255,.07),transparent 70%);
  }

  .e{position:relative;z-index:1;text-align:center;max-width:640px}

  .e__mark{display:block;width:clamp(52px,5vw,74px);margin:0 auto clamp(28px,3.4vw,44px);color:#fff;opacity:.9}
  .e__mark svg{width:100%;height:auto;display:block}

  .e__code{
    margin:0;font-family:var(--ff-display);font-weight:400;
    font-size:clamp(76px,15vw,190px);line-height:.86;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.34));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .e__title{
    margin:clamp(18px,2vw,26px) 0 0;
    font-size:clamp(19px,2vw,27px);font-weight:400;letter-spacing:-.014em;
  }
  .e__text{
    margin:12px auto 0;max-width:44ch;
    font-size:clamp(14px,1.2vw,16px);color:var(--mute);
  }

  .e__back{
    display:inline-flex;align-items:center;gap:10px;
    margin-top:clamp(28px,3.2vw,42px);
    padding:12px 26px;border:1px solid var(--line);border-radius:999px;
    font-size:14px;letter-spacing:.02em;
    background:linear-gradient(140deg,rgba(255,255,255,.05),rgba(255,255,255,.012) 62%);
    transition:border-color .4s var(--ease),background .4s var(--ease),transform .4s var(--ease);
  }
  .e__back svg{width:17px;height:17px;flex:none}
  .e__back:hover{
    border-color:rgba(255,255,255,.3);
    background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.03) 62%);
    transform:translateY(-2px);
  }
  .e__back:focus-visible{outline:2px solid #fff;outline-offset:3px}

  /* появление */
  .e > *{opacity:0;transform:translateY(14px);animation:up .8s var(--ease) forwards}
  .e > *:nth-child(1){animation-delay:.04s}
  .e > *:nth-child(2){animation-delay:.12s}
  .e > *:nth-child(3){animation-delay:.2s}
  .e > *:nth-child(4){animation-delay:.28s}
  .e > *:nth-child(5){animation-delay:.36s}
  @keyframes up{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .e > *{animation:none;opacity:1;transform:none}
    .e__back{transition:none}
  }
</style>
</head>
